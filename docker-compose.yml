services:
  db:
    image: mysql:8.0
    container_name: gestionplus_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestionplus
      MYSQL_USER: gestionplus
      MYSQL_PASSWORD: gestionplus
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  backend:
    build: ./Backend
    container_name: gestionplus_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"


  frontend:
    build: ./Frontend
    container_name: gestionplus_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro


volumes:
  db_data: